name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout репозитория
      uses: actions/checkout@v3

    - name: Установка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Установка зависимостей
      run: pip install keyboard pyperclip

    - name: Установка PyInstaller
      run: pip install pyinstaller

    - name: Сборка EXE через PyInstaller
      run: |
        pyinstaller punto_switcher_clone.spec
        dir dist

    - name: Сохранение .exe как артефакта
      uses: actions/upload-artifact@v2
      with:
        name: punto_switcher_clone
        path: dist/punto_switcher_clone.exe
