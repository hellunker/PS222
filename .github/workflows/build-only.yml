name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout репозитория
      uses: actions/checkout@v3

    - name: Установка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Установка зависимостей
      run: pip install keyboard pyperclip

    - name: Установка PyInstaller
      run: pip install pyinstaller

    - name: Сборка EXE через PyInstaller
      run: |
        pyinstaller punto_switcher_clone.spec
        dir dist

    - name: Архивировать exe-файл
      run: Compress-Archive -Path dist\punto_switcher_clone.exe -DestinationPath dist\punto_switcher_clone.zip

    - name: Показать содержимое папки dist
      run: dir dist
