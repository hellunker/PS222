name: Build EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v3

      - name: Установка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Сборка EXE
        run: |
          pyinstaller punto_switcher_clone.spec

      - name: Посмотреть содержимое папки dist
        run: Get-ChildItem -Recurse -Path dist

      - name: Архивировать EXE
        run: Compress-Archive -Path dist\* -DestinationPath punto_switcher_clone.zip

      - name: Загрузить ZIP как артефакт
        uses: actions/upload-artifact@v2.3.1
        with:
          name: punto_switcher_clone_zip
          path: punto_switcher_clone.zip

      - name: Загрузить EXE как артефакт
        uses: actions/upload-artifact@v2.3.1
        with:
          name: punto_switcher_clone_exe
          path: dist/punto_switcher_clone.exe
