name: Windows Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller punto_switcher_clone.spec

      - name: Compress build output
        run: Compress-Archive -Path dist\* -DestinationPath punto_switcher_clone.zip

      - name: Commit ZIP artifact to repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir artifacts
          mv punto_switcher_clone.zip artifacts/
          git add artifacts/punto_switcher_clone.zip
          git commit -m "Add build artifact"
          git push
