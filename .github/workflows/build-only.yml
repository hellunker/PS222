name: Build EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller punto_switcher_clone.spec

      - name: Список файлов в dist
        run: Get-ChildItem dist

      - name: Упаковать dist в zip
        run: Compress-Archive -Path dist\* -DestinationPath punto_switcher_clone.zip

      - name: Загрузить артефакт (zip)
        uses: actions/upload-artifact@v2
        with:
          name: punto_switcher_clone_zip
          path: punto_switcher_clone.zip
