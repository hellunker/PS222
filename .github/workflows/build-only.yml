name: Build EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          if (Test-Path "requirements.txt") {
            pip install -r requirements.txt
          }

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller punto_switcher_clone.py --onefile --noconsole
          dir dist

      - name: Archive EXE
        run: Compress-Archive -Path dist\* -DestinationPath punto_switcher_clone.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v2
        with:
          name: punto_switcher_clone
          path: punto_switcher_clone.zip
